[package]
name = "ports-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "ports_cli"
path = "src/lib.rs"

[[bin]]
name = "ports"
path = "src/main.rs"

[[bin]]
name = "whoisonport"
path = "src/bin/whoisonport.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["clock"] }
comfy-table = "7.2.1"
ctrlc = "3.5.0"
dialoguer = "0.12.0"
owo-colors = "4.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.37.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }
